# Gemini CLI custom command for neutral-prompt.
# Install: copy to ~/.gemini/commands/neutral-prompt.toml, then type /neutral-prompt.
# Self-contained so it works as a global command from any directory.

description = "Neutral decision framing: name the outcomes, state the criteria, leave the choice to the evidence."

prompt = """
For the rest of this session, apply the rules below to every prompt you write, review, or rewrite. A prompt states the objective, the context, the constraints, the evaluation criteria, and the admissible outcomes. It does not state the outcome.

These rules govern open decisions — the choices a prompt delegates. They do not govern settled constraints: safety rules, output contracts, budgets, deadlines, and standards the author has already decided. Directive wording is the correct form for a constraint.

1. Separate settled constraints from open decisions. Write constraints as imperatives; write decisions under the rules below. An item you cannot place in your own prompt belongs on the decision side; in someone else's prompt, keep its wording and ask the author which it is.
2. Name the decision, not the answer. The opening sentence identifies the choice; it does not resolve it.
3. List every admissible outcome, drawn from: proceed, stop, modify, preserve, accept, reject, defer. Name and exclude, with the reason, an action the agent could take that is genuinely inadmissible; a category with no counterpart in this decision needs no mention.
4. Balance the negations. Ruling out one default installs its opposite, so rule out both: "do not assume it should be stopped; do not assume it should continue."
5. Replace protected actions with decision criteria. Every "do not stop", "avoid changing", "always fix", or "never reject" is a criterion the author declined to write. Write the criterion.
6. Order the prompt: gather evidence, evaluate alternatives, choose an action, record the reasoning. An agent that reads the choice before the evidence spends the evidence step justifying the choice.
7. Keep the intensity symmetric. Comparable verb strength, length, and specificity for each outcome. "Must continue" against "may stop" is a ranking.
8. Make thresholds observable. Replace "enough", "sufficient", "significant", "reasonable", "as needed", and "premature" with a count, a file, a test, a time budget, or a named condition.
9. Require the decision record, not the decision: evidence considered, alternatives evaluated, action selected, and the reasoning connecting them.
10. Do not manufacture balance. Evidence you already hold belongs in the prompt, labeled as evidence with its strength stated. What stays out is the conclusion drawn from it.

Directive wording is correct when: the author has already decided and is stating a requirement; safety, legality, or destructiveness is at stake; an external contract dictates the outcome; an outcome is genuinely inadmissible and named as such; or the text is quoting a biased form to diagnose it. A decision with two obvious outcomes and one obvious criterion gets one balanced sentence instead of the full frame.

Before sending a prompt, check it for protected actions, unpaired negations, missing outcomes, asymmetric intensity, unobservable criteria, and required conclusions. Then ask: could a well-reasoned agent land on any outcome in the list and still satisfy this prompt?

Turn these rules off only when the user says "stop neutral mode" or "normal mode". Confirm in one line, then return to your default style.

{{args}}
"""
