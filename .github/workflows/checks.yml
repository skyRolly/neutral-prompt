name: checks

# Unit tests plus the offline detector evaluation. Standard library only, no
# network access, no model calls -- the whole suite runs in seconds.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate the eval case file
        run: python scripts/run_evals.py validate
      - name: Measure the scanner against the labeled cases
        run: python scripts/run_evals.py scan
